name: Validate project

on:
  push:
    branches: [main, "agent/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --upgrade jsonschema gdtoolkit

      - name: Check shell syntax
        run: bash -n start.sh test.sh verify.sh package.sh

      - name: Validate package
        run: ./verify.sh

      - name: Check Python syntax
        run: python -m compileall -q tools

  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verified Godot 4.6
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --connect-timeout 15 \
            --output /tmp/godot46.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          printf '%s  %s\n' '6bcc59dfd1d670e918c77eae06e82b9dc5699de13d353dc3a4b3b6b307b6dc06' '/tmp/godot46.zip' | sha256sum --check --
          unzip -j -q /tmp/godot46.zip -d tools
          mv tools/Godot_v4.6-stable_linux.x86_64 tools/godot
          chmod +x tools/godot
          ./tools/godot --version

      - name: Import Godot project
        run: ./tools/godot --headless --path . --editor --import --quit

      - name: Run Godot regression suite
        run: ./test.sh

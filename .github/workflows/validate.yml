name: Validate project

on:
  push:
    branches: [main, "agent/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validators
        run: python -m pip install --upgrade jsonschema gdtoolkit

      - name: Check shell syntax
        run: bash -n start.sh test.sh verify.sh package.sh START_GAME.sh PRUEFEN.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check web/data.js
          node --check web/revival-data.js
          node --check web/engine.js
          node --check web/revival-missions.js
          node --check web/revival-world.js
          node --check web/revival-engine.js
          node --check web/app.js
          node --check web/repair-bootstrap.js
          node --check web/revival-ui.js
          node --check web/repair-04a.js
          node --check web/tests/engine.test.js
          node --check web/tests/revival-engine.test.js
          node --check web/tests/director-simulation.test.js
          node --check web/tests/ui-smoke.test.js
          node --check web/tests/static-ui.test.js
          node --check web/tests/ui-regression.test.js
          node --check web/tests/revival-contract.test.js

      - name: Run qualified 0.9 core tests
        run: node web/tests/engine.test.js

      - name: Run LIVING-CITY-04A Revival tests
        run: node web/tests/revival-engine.test.js

      - name: Run LIVING-CITY-04A Director simulation
        run: node web/tests/director-simulation.test.js

      - name: Run LIVING-CITY-04A UI smoke
        run: node web/tests/ui-smoke.test.js

      - name: Run final static UI contract
        run: node web/tests/static-ui.test.js

      - name: Run map and control regression
        run: node web/tests/ui-regression.test.js

      - name: Run Revival module and visual contract
        run: node web/tests/revival-contract.test.js

      - name: Rebuild deterministic manifest
        run: python tools/build_manifest.py

      - name: Validate package
        run: ./verify.sh

      - name: Check Python syntax
        run: python -m compileall -q tools

      - name: Publish LIVING-CITY-04A source artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPPOPPI-Bunkerwahrheit-LIVING-CITY-04A
          if-no-files-found: error
          retention-days: 14
          path: |
            web/
            README.md
            CHANGELOG.md
            docs/PROJECT_STATUS.md
            docs/REVIVAL_MASTER_PROMPT.md
            AGENTS.md
            START_GAME.sh
            START_GAME.bat
            PRUEFEN.sh
            KLICKSTART_ANLEITUNG.md

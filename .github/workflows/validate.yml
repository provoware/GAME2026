name: Validate project

on:
  push:
    branches: [main, "agent/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validators
        run: python -m pip install --upgrade jsonschema gdtoolkit

      - name: Check shell syntax
        run: bash -n start.sh test.sh verify.sh package.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check web/data.js
          node --check web/engine.js
          node --check web/app.js
          node --check web/tests/engine.test.js
          node --check web/tests/ui-smoke.test.js
          node --check web/tests/static-ui.test.js

      - name: Run LIVING-CITY-03 engine tests
        run: node web/tests/engine.test.js

      - name: Run LIVING-CITY-03 UI smoke
        run: node web/tests/ui-smoke.test.js

      - name: Run LIVING-CITY-03 static UI contract
        run: node web/tests/static-ui.test.js

      - name: Rebuild deterministic manifest
        run: python tools/build_manifest.py

      - name: Validate package
        run: ./verify.sh

      - name: Check Python syntax
        run: python -m compileall -q tools

      - name: Publish LIVING-CITY-03 source artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPPOPPI-Bunkerwahrheit-LIVING-CITY-03
          if-no-files-found: error
          retention-days: 14
          path: |
            web/
            README.md
            CHANGELOG.md
            docs/PROJECT_STATUS.md
            AGENTS.md
